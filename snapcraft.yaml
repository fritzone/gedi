name: garland-turbine
title: Garland Turbine
icon: snap/gui/garland-turbine-gui.png
base: core22
version: '0.1'
summary: Garland Turbine - A simple yet powerful C++ Gui editor
description: |
  Garland Turbine is a lightweight and feature-rich C++ Gui editor.
  It provides syntax highlighting, a build system,
  a custom help system, and more. It can run both in the terminal
  and as a graphical application.
license: MIT
contact: https://github.com/fritzone/gedi/issues
issues: https://github.com/fritzone/gedi/issues
source-code: https://github.com/fritzone/gedi
website: https://github.com/fritzone/gedi

grade: stable
confinement: strict

# Ignore unused library warnings since we are bundling a compiler toolchain
lint:
  ignore:
    - library

apps:
  garland-turbine:
    command: usr/bin/gedi
    desktop: snap/gui/garland-turbine.desktop
    plugs:
      - home
      - network
      - removable-media
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TERMINFO: $SNAP/usr/share/terminfo
      # Ensure bundled tools and wrappers are found first
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      # Help the bundled compiler find its headers and libraries
      CPATH: $SNAP/usr/include/c++/12:$SNAP/usr/include/x86_64-linux-gnu/c++/12:$SNAP/usr/include/x86_64-linux-gnu:$SNAP/usr/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include-fixed
      C_INCLUDE_PATH: $SNAP/usr/include/x86_64-linux-gnu:$SNAP/usr/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include-fixed
      CPLUS_INCLUDE_PATH: $SNAP/usr/include/c++/12:$SNAP/usr/include/x86_64-linux-gnu/c++/12:$SNAP/usr/include/x86_64-linux-gnu:$SNAP/usr/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include-fixed
      LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12:$SNAP/usr/lib:$SNAP/lib
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12:$SNAP/usr/lib:$SNAP/lib
      # Help GCC find its internal components
      COMPILER_PATH: $SNAP/usr/lib/gcc/x86_64-linux-gnu/12
      GCC_EXEC_PREFIX: $SNAP/usr/lib/gcc/
      # Help CMake find its modules
      CMAKE_ROOT: $SNAP/usr/share/cmake-3.22

  gui:
    command: usr/bin/gedi-gui
    desktop: snap/gui/garland-turbine-gui.desktop
    plugs:
      - home
      - network
      - removable-media
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - opengl
      - audio-playback
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # Ensure bundled tools and wrappers are found first
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      # Help the bundled compiler find its headers and libraries
      CPATH: $SNAP/usr/include/c++/12:$SNAP/usr/include/x86_64-linux-gnu/c++/12:$SNAP/usr/include/x86_64-linux-gnu:$SNAP/usr/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include-fixed
      C_INCLUDE_PATH: $SNAP/usr/include/x86_64-linux-gnu:$SNAP/usr/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include-fixed
      CPLUS_INCLUDE_PATH: $SNAP/usr/include/c++/12:$SNAP/usr/include/x86_64-linux-gnu/c++/12:$SNAP/usr/include/x86_64-linux-gnu:$SNAP/usr/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12/include-fixed
      LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12:$SNAP/usr/lib:$SNAP/lib
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/gcc/x86_64-linux-gnu/12:$SNAP/usr/lib:$SNAP/lib
      LIBGL_DRIVERS_PATH: $SNAP/usr/lib/x86_64-linux-gnu/dri
      # Help GCC find its internal components
      COMPILER_PATH: $SNAP/usr/lib/gcc/x86_64-linux-gnu/12
      GCC_EXEC_PREFIX: $SNAP/usr/lib/gcc/
      # Help CMake find its modules
      CMAKE_ROOT: $SNAP/usr/share/cmake-3.22

layout:
  /usr/share/gedi:
    bind: $SNAP/usr/share/gedi
  /usr/local/lib/python3/dist-packages/gedi:
    bind: $SNAP/usr/lib/python3/dist-packages/gedi

parts:
  gedi:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_PREFIX_PATH=/usr/lib/llvm-14
    build-packages:
      - g++
      - cmake
      - libncurses-dev
      - libclang-14-dev
      - libsdl2-dev
    stage-packages:
      - libncursesw6
      - libclang1-14
      - python3
      - ncurses-term
      - locales-all
      - g++-12
      - gcc-12
      - binutils
      - make
      - cmake
      - ninja-build
      - pkg-config
      - libc6-dev
      - libc-dev-bin
      - linux-libc-dev
      - libgcc-12-dev
      - libstdc++-12-dev
      - libasan8
      - libubsan1
      - libitm1
      - libquadmath0
      - libtsan2
      - liblsan0
      - libatomic1
      - libgomp1
      - libsdl2-2.0-0
      - libgl1
      - libgl1-mesa-dri
      - libpulse0
    prime:
      - -usr/share/man
      - -usr/share/doc

  compiler-links:
    plugin: nil
    after: [gedi]
    override-prime: |
      mkdir -p $CRAFT_PRIME/bin
      # Create wrappers for gcc, g++ and cpp that include necessary search paths.
      # We use sed to strip the leading indentation from the heredoc.
      for cmd in gcc g++ cpp; do
        cat <<EOF | sed 's/^      //' > $CRAFT_PRIME/bin/$cmd
      #!/bin/bash
      exec \$SNAP/usr/bin/${cmd}-12 \\
        -L\$SNAP/usr/lib/x86_64-linux-gnu \\
        -L\$SNAP/lib/x86_64-linux-gnu \\
        -L\$SNAP/usr/lib/gcc/x86_64-linux-gnu/12 \\
        -B\$SNAP/usr/lib/gcc/x86_64-linux-gnu/12 \\
        "\$@"
      EOF
        chmod +x $CRAFT_PRIME/bin/$cmd
      done

      # Patch linker scripts (libc.so, libpthread.so, etc.) to remove absolute paths
      # that point outside the snap. By removing them, the linker will correctly
      # use the search paths provided via -L.
      find $CRAFT_PRIME/usr/lib/x86_64-linux-gnu -name "*.so" -type f | while read -r f; do
        if grep -q "GROUP" "$f" || grep -q "INPUT" "$f"; then
          echo "Patching linker script: $f"
          sed -i 's|/usr/lib/x86_64-linux-gnu/||g; s|/lib/x86_64-linux-gnu/||g' "$f"
        fi
      done
